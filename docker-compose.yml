services:
  emailstore:
    image: ghcr.io/copex-uk/emailstore:latest
    container_name: emailstore
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./data:/app/data

    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      # Listen on all interfaces inside the container so Docker port mapping works.
      # External access is still controlled by the ports: binding above.
      - BIND_HOST=0.0.0.0

    # Run as the same UID/GID defined in the Dockerfile (10001)
    user: "10001:10001"

    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
