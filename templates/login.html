{{define "login.html"}}<!DOCTYPE html>
<html lang="en" data-theme="">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — EmailStore</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  const t = localStorage.getItem('theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
</script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-card-header">
      <h1>EmailStore</h1>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle theme">
        <span class="theme-icon"></span>
      </button>
    </div>
    {{if .Error}}<p class="alert alert-error">{{.Error}}</p>{{end}}
    <form method="POST" action="/login" class="login-form" id="login-form">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}" id="csrf-field">
      <label class="field-label">Password
        <input type="password" name="password" required autofocus class="field-input" id="password-field">
      </label>
      <button type="submit" class="btn btn-primary btn-full">Sign in</button>
    </form>
    <script>
    // Ensure the CSRF cookie is confirmed present before allowing submit.
    // On the very first load the browser may not have written the cookie yet.
    document.getElementById('login-form').addEventListener('submit', function(e) {
      var token = document.getElementById('csrf-field').value;
      var cookie = document.cookie.split(';').some(function(c) {
        return c.trim().startsWith('es_csrf=');
      });
      if (!cookie) {
        // Cookie not yet visible — reload to get a fresh one, then the user
        // can submit again. Happens at most once per session.
        e.preventDefault();
        window.location.reload();
      }
    });
    </script>
    <p style="margin-top:1rem;font-size:0.85rem;text-align:center;">
      <a href="/reset-password" style="color:var(--primary)">Forgot password?</a>
    </p>
  </div>
</div>
<script src="/static/theme.js"></script>
</body></html>{{end}}
