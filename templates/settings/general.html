{{define "settings/general.html"}}<!DOCTYPE html>
<html lang="en" data-theme="">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>General — EmailStore</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>const t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);</script>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="sidebar-header"><a href="/" class="logo">EmailStore</a><button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle theme"><span class="theme-icon"></span></button></div>
    <ul class="nav-list">
      <li><a href="/settings/mailbox" class="nav-item">Mailbox</a></li>
      <li><a href="/settings/senders" class="nav-item">Allowed senders</a></li>
      <li><a href="/settings/categories" class="nav-item">Categories</a></li>
      <li><a href="/settings/policy" class="nav-item">Security policy</a></li>
      <li><a href="/settings/security" class="nav-item">Password & session</a></li>
      <li><a href="/settings/general" class="nav-item active">General</a></li>
    </ul>
    <div class="sidebar-footer"><a href="/" class="nav-item">← Inbox</a></div>
  </nav>
  <main class="settings-main">
    <h1>General</h1>
    {{if .Success}}<p class="alert alert-success">{{.Success}}</p>{{end}}
    {{if .Error}}<p class="alert alert-error">{{.Error}}</p>{{end}}
    <form method="POST" action="/settings/general" class="settings-form">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <label>Max attachment size (MB)
        <input type="number" name="max_attach_mb" value="{{.MaxAttachMB}}" min="1" max="500">
      </label>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </main>
</div>
<script src="/static/theme.js"></script>
</body></html>{{end}}
